
name: Documentation Validation

on:
  push:
  pull_request:

jobs:
  validate-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install PyYAML openapi-spec-validator

      - name: Validate OpenAPI specification
        run: |
          openapi-spec-validator spec/openapi.yaml

      - name: Generate API documentation
        run: |
          python scripts/generate_docs.py

      - name: Check generated documentation
        run: |
          python - <<'PY'
          from pathlib import Path

          content = Path(
              "docs/generated-api.md"
          ).read_text(encoding="utf-8")

          required_content = [
              "# FlowOps Automation API",
              "POST /jobs",
              "GET /jobs/{jobId}",
              "workflowId",
              "jobId",
              "pending, running, completed, failed",
          ]

          missing = [
              item for item in required_content
              if item not in content
          ]

          if missing:
              raise SystemExit(
                  f"Missing documentation content: {missing}"
              )

          print("Documentation content checks passed.")
          PY
          
      - name: Check documentation drift
        run: |
          git diff --exit-code -- docs/generated-api.md

